name: Backend CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'
      - name: Restore
        run: dotnet restore MomCare.sln
      - name: Build
        run: dotnet build MomCare.sln --configuration Release --no-restore
      - name: Test
        run: dotnet test MomCare.sln --configuration Release --no-build --collect:"XPlat Code Coverage"
