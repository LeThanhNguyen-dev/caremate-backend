name: Build and deploy ASP.Net Core app to Azure Web App - caremate-api

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      - name: Restore
        run: dotnet restore src/MomCare.Api/MomCare.Api.csproj

      - name: Build
        run: dotnet build src/MomCare.Api/MomCare.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/MomCare.Api/MomCare.Api.csproj -c Release -o publish --no-build

      - name: Verify output
        run: ls -la publish

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: publish

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: publish

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_17B3465A1B8A49668078AA354C23A580 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_32995ADC892D4E709D7ED5719DF6E3F2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_AEE546F192D143D68974C3806B601C07 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'caremate-api'
          slot-name: 'Production'
          package: publish
          clean: true